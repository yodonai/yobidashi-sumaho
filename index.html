<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スマホ音声呼び出し</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            margin: 0; 
            background: #121212; 
            color: #fff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            padding: 15px;
            padding-bottom: 150px; /* 大型固定ボタン用の余白 */
            user-select: none;
        }

        /* 1. 最上部：履歴エリア */
        .history-section {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 15px auto;
        }
        .history-title {
            font-size: 13px;
            color: #888;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 140px;
            overflow-y: auto;
        }
        .history-item {
            background: #1e1e1e;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2a2a2a;
        }
        .history-name-wrap {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .history-kana {
            font-size: 16px;
            font-weight: bold;
            color: #00ffcc;
        }
        .history-kanji {
            font-size: 12px;
            color: #777;
        }
        .history-time {
            font-size: 11px;
            color: #666;
            margin-right: 6px;
        }
        .re-call-btn {
            background: #333;
            color: #00ffcc;
            border: 1px solid #444;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        /* 2. 中央：メイン表示エリア */
        .display-area {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
            background: #1e1e1e;
            padding: 20px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .status-badge {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
            padding: 4px 12px;
            background: #2a2a2a;
            border-radius: 15px;
            display: inline-block;
        }
        .kana-main-box {
            font-size: 38px;
            font-weight: bold;
            color: #00ffcc;
            min-height: 50px;
            word-break: break-all;
            line-height: 1.2;
            letter-spacing: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .kanji-sub-box {
            font-size: 16px;
            color: #aaa;
            margin-top: 6px;
            min-height: 22px;
        }

        /* 3. 中央下：手動直接入力エリア */
        .manual-input-area {
            width: 100%;
            max-width: 500px;
            margin: 15px auto 0 auto;
            display: flex;
            gap: 8px;
        }
        .manual-input {
            flex: 1;
            padding: 12px 14px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #222;
            color: #fff;
            outline: none;
        }
        .manual-input:focus { border-color: #007bff; }
        .btn-manual {
            background: #444;
            color: #fff;
            border: 1px solid #555;
            padding: 0 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        /* 4. 最下部：大型固定ボタン（高さ2倍） */
        .fixed-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #181818;
            padding: 12px 15px;
            display: flex;
            justify-content: center;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.7);
            z-index: 100;
        }
        .btn-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            gap: 12px;
        }
        .action-btn {
            flex: 1;
            height: 120px; /* 従来の2倍の高さ */
            border-radius: 14px;
            border: none;
            font-size: 24px; /* テキストサイズも拡大 */
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.15s;
        }
        .action-btn:active { transform: scale(0.97); }

        .btn-mic {
            background: #007bff;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
        }
        .btn-mic.listening {
            background: #dc3545;
            box-shadow: 0 0 20px rgba(220, 53, 69, 0.9);
            animation: pulse 1.2s infinite;
        }

        .btn-call {
            background: #28a745;
            color: white;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }
        .btn-call:disabled {
            background: #333;
            color: #666;
            box-shadow: none;
            cursor: not-allowed;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 1. 最上部：履歴エリア -->
    <div class="history-section">
        <div class="history-title">
            <span>呼び出し履歴</span>
            <span style="font-size: 11px;">※タップで再呼出</span>
        </div>
        <div id="historyList" class="history-list"></div>
    </div>

    <!-- 2. 中央：カタカナメイン表示画面 -->
    <div class="display-area">
        <div id="statusBadge" class="status-badge">待機中</div>
        <div id="kanaDisplay" class="kana-main-box">案内表示</div>
        <div id="kanjiDisplay" class="kanji-sub-box"></div>
    </div>

    <!-- 3. 中央下：手動直接入力エリア -->
    <div class="manual-input-area">
        <input type="text" id="manualInput" class="manual-input" placeholder="直接入力（カタカナ・漢字）..." onkeypress="handleManualKey(event)">
        <button class="btn-manual" onclick="setManualName()">手動入力</button>
    </div>

    <!-- 4. 最下部：高さ2倍の大型操作ボタン -->
    <div class="fixed-footer">
        <div class="btn-container">
            <button id="micBtn" class="action-btn btn-mic" onclick="startVoiceInput()">
                <span style="font-size: 32px;">🎤</span>
                <span>音声入力</span>
            </button>
            <button id="callBtn" class="action-btn btn-call" onclick="executeCall()" disabled>
                <span style="font-size: 32px;">📢</span>
                <span>呼出</span>
            </button>
        </div>
    </div>

<script>
    let audioCtx = null;
    let wakeLock = null;
    let resetTimer = null;
    let recognition = null;
    let isListening = false;
    let currentRaw = "";
    let currentKana = "";

    // 漢字の構成パーツからカタカナ音を組み立てる辞書
    const kanjiMap = {
        '池':'イケ','水':'ミズ','川':'カワ','山':'ヤマ','田':'タ','中':'ナカ',
        '小':'コ','林':'バヤシ','森':'モリ','原':'ハラ','野':'ノ','藤':'トウ',
        '木':'キ','村':'ムラ','本':'モト','井':'イ','石':'イシ','島':'シマ',
        '谷':'タニ','岡':'オカ','坂':'サカ','松':'マツ','竹':'タケ','梅':'ウメ',
        '福':'フク','金':'カネ','吉':'ヨシ','大':'オオ','佐':'サ','加':'カ',
        '安':'アン','渡':'ワタ','辺':'ナベ','部':'ベ','高':'タカ','橋':'ハシ',
        '鈴':'スズ','斉':'サイ','斎':'サイ','近':'コン','遠':'エン','後':'ゴ',
        '前':'マエ','内':'ウチ','宮':'ミヤ','岩':'イワ','柴':'シバ','酒':'サカ'
    };

    function convertToStrictKana(text) {
        if (!text) return '';
        let result = '';
        for (let char of text) {
            if (kanjiMap[char]) {
                result += kanjiMap[char];
            } else {
                result += char;
            }
        }
        return result.replace(/[\u3041-\u3096]/g, function(match) {
            return String.fromCharCode(match.charCodeAt(0) + 0x60);
        });
    }

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {}
    }

    function startBluetoothKeepAlive() {
        setInterval(() => {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {}
        }, 600000);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = false;
        recognition.continuous = false;

        recognition.onstart = () => {
            isListening = true;
            document.getElementById('micBtn').classList.add('listening');
            document.getElementById('micBtn').innerHTML = '<span style="font-size:32px;">👂</span><span>認識中...</span>';
            document.getElementById('statusBadge').innerText = 'お名前をお話しください';
            document.getElementById('statusBadge').style.color = '#00ffcc';
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript.trim();
            const clean = transcript.replace(/(さん|様|さま|君|くん)$/, '');
            
            currentRaw = clean;
            currentKana = convertToStrictKana(clean);

            document.getElementById('kanaDisplay').innerText = currentKana + ' さん';
            document.getElementById('kanjiDisplay').innerText = (currentRaw !== currentKana) ? `[ ${currentRaw} ]` : '';
            document.getElementById('statusBadge').innerText = '確認して [呼出] をタップ';
            document.getElementById('statusBadge').style.color = '#ffc107';

            document.getElementById('callBtn').disabled = false;
        };

        recognition.onerror = (event) => {
            if (event.error === 'not-allowed') {
                alert('マイクが許可されていません。');
            }
            resetMicBtn();
        };

        recognition.onend = () => {
            resetMicBtn();
        };
    }

    function resetMicBtn() {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
        document.getElementById('micBtn').innerHTML = '<span style="font-size:32px;">🎤</span><span>音声入力</span>';
    }

    function initAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            requestWakeLock();
            startBluetoothKeepAlive();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function startVoiceInput() {
        initAudioContext();
        if (recognition && !isListening) {
            try {
                recognition.start();
            } catch (e) {}
        }
    }

    // 手動入力
    function setManualName() {
        initAudioContext();
        const input = document.getElementById('manualInput');
        const val = input.value.trim().replace(/(さん|様|さま|君|くん)$/, '');
        if (!val) return;

        currentRaw = val;
        currentKana = convertToStrictKana(val);

        document.getElementById('kanaDisplay').innerText = currentKana + ' さん';
        document.getElementById('kanjiDisplay').innerText = (currentRaw !== currentKana) ? `[ ${currentRaw} ]` : '';
        document.getElementById('statusBadge').innerText = '確認して [呼出] をタップ';
        document.getElementById('statusBadge').style.color = '#ffc107';

        document.getElementById('callBtn').disabled = false;
        input.value = '';
        input.blur();
    }

    function handleManualKey(event) {
        if (event.key === 'Enter') {
            setManualName();
        }
    }

    // 呼出実行
    function executeCall(forcedKana, forcedRaw) {
        initAudioContext();
        const kanaToCall = forcedKana || currentKana;
        const rawToCall = forcedRaw || currentRaw;
        if (!kanaToCall) return;

        if (resetTimer) clearTimeout(resetTimer);

        document.getElementById('kanaDisplay').innerText = kanaToCall + ' さん';
        document.getElementById('kanjiDisplay').innerText = (rawToCall && rawToCall !== kanaToCall) ? `[ ${rawToCall} ]` : '';
        document.getElementById('statusBadge').innerText = '呼び出し中';
        document.getElementById('statusBadge').style.color = '#28a745';
        document.getElementById('callBtn').disabled = true;

        speak(kanaToCall);

        if (!forcedKana) {
            addHistory(kanaToCall, rawToCall);
            currentRaw = "";
            currentKana = "";
        }

        resetTimer = setTimeout(() => {
            resetToStandby();
        }, 60000);
    }

    function resetToStandby() {
        document.getElementById('kanaDisplay').innerText = '案内表示';
        document.getElementById('kanjiDisplay').innerText = '';
        document.getElementById('statusBadge').innerText = '待機中';
        document.getElementById('statusBadge').style.color = '#888';
        document.getElementById('callBtn').disabled = true;
    }

    function addHistory(kana, raw) {
        const list = document.getElementById('historyList');
        const item = document.createElement('div');
        item.className = 'history-item';

        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        const subHtml = (raw && raw !== kana) ? `<span class="history-kanji">[${raw}]</span>` : '';

        item.innerHTML = `
            <div class="history-name-wrap">
                <span class="history-time">${timeStr}</span>
                <span class="history-kana">${kana}</span>
                ${subHtml}
            </div>
            <button class="re-call-btn" onclick="executeCall('${kana}', '${raw || ''}')">呼出</button>
        `;
        list.insertBefore(item, list.firstChild);
    }

    // チャイム & 発声
    function speak(nameKana) {
        window.speechSynthesis.cancel();
        playChimeDouble(() => {
            const text = `${nameKana}さん、1番の診察室へお入りください`;
            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = 'ja-JP';
            uttr.rate = 0.95;
            window.speechSynthesis.speak(uttr);
        });
    }

    function playChimeDouble(callback) {
        playSingleChime(() => {
            setTimeout(() => { playSingleChime(callback); }, 200);
        });
    }

    function playSingleChime(callback) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(784, audioCtx.currentTime); 
            osc.frequency.setValueAtTime(1046, audioCtx.currentTime + 0.15); 
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            osc.connect(gain); 
            gain.connect(audioCtx.destination);
            osc.start(); 
            osc.stop(audioCtx.currentTime + 0.6);
            setTimeout(callback, 600);
        } catch (e) { callback(); }
    }
</script>
</body>
</html>
