<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スマホ音声呼び出し</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            margin: 0; 
            background: #121212; 
            color: #fff; 
            min-height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            padding: 10px; 
            padding-bottom: 130px; 
            user-select: none;
        }

        /* 1. 履歴エリア */
        .history-section {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            flex: 1;
        }
        .history-title {
            font-size: 13px;
            color: #888;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 110px;
            overflow-y: auto;
        }
        .history-item {
            background: #1e1e1e;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2a2a2a;
        }
        .history-name-wrap {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .history-kana {
            font-size: 16px;
            font-weight: bold;
            color: #00ffcc;
        }
        .history-time {
            font-size: 11px;
            color: #666;
            margin-right: 6px;
        }
        .re-call-btn {
            background: #333;
            color: #00ffcc;
            border: 1px solid #444;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        /* 2. メイン表示エリア */
        .display-area {
            width: 100%;
            max-width: 500px;
            margin: 10px auto;
            text-align: center;
            background: #1e1e1e;
            padding: 15px; 
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .status-badge {
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
            padding: 3px 10px;
            background: #2a2a2a;
            border-radius: 15px;
            display: inline-block;
        }
        .kana-main-box {
            font-size: 36px; 
            font-weight: bold;
            color: #00ffcc;
            min-height: 45px;
            word-break: break-all;
            line-height: 1.2;
            letter-spacing: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3. 手動入力エリア */
        .manual-input-area {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 10px auto;
            display: flex;
            gap: 8px;
        }
        .manual-input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #222;
            color: #fff;
            outline: none;
        }
        .manual-input:focus { border-color: #007bff; }
        .btn-set {
            background: #444;
            color: #fff;
            border: 1px solid #555;
            padding: 0 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        /* 4. 下部大型固定ボタン */
        .fixed-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #181818;
            padding: 10px;
            display: flex;
            justify-content: center;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.7);
            z-index: 100;
        }
        .btn-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            gap: 12px;
        }
        .action-btn {
            flex: 1;
            height: 100px; 
            border-radius: 12px;
            border: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
        }
        .action-btn:active { transform: scale(0.97); }

        .btn-mic {
            background: #007bff;
            color: white;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.4);
        }
        .btn-mic.listening {
            background: #dc3545;
            box-shadow: 0 0 20px rgba(220, 53, 69, 0.9);
            animation: pulse 1.2s infinite;
        }

        .btn-call {
            background: #28a745;
            color: white;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
        }
        .btn-call:disabled {
            background: #333;
            color: #666;
            box-shadow: none;
            cursor: not-allowed;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 1. 履歴エリア -->
    <div class="history-section">
        <div class="history-title">
            <span>呼び出し履歴</span>
            <span style="font-size: 11px;">※タップで再呼出</span>
        </div>
        <div id="historyList" class="history-list"></div>
    </div>

    <!-- 2. カタカナメイン表示 -->
    <div class="display-area">
        <div id="statusBadge" class="status-badge">準備完了</div>
        <div id="kanaDisplay" class="kana-main-box">案内表示</div>
    </div>

    <!-- 3. 手動入力エリア -->
    <div class="manual-input-area">
        <input type="text" id="manualInput" class="manual-input" placeholder="直接入力（カタカナ・ひらがな）..." onkeypress="handleManualKey(event)">
        <button class="btn-set" onclick="setManualName()">手動入力</button>
    </div>

    <!-- 4. 固定操作ボタン -->
    <div class="fixed-footer">
        <div class="btn-container">
            <button id="micBtn" class="action-btn btn-mic" onclick="startVoiceInput()">
                <span style="font-size: 32px;">🎤</span>
                <span>音声入力</span>
            </button>
            <button id="callBtn" class="action-btn btn-call" onclick="executeCall()" disabled>
                <span style="font-size: 32px;">📢</span>
                <span>呼出</span>
            </button>
        </div>
    </div>

<script>
    let audioCtx = null;
    let wakeLock = null;
    let resetTimer = null;
    let recognition = null;
    let isListening = false;
    let currentKana = "";
    let globalUtterance = null; 

    const kanjiMap = {
        '池':'イケ','水':'ミズ','川':'カワ','山':'ヤマ','田':'タ','中':'ナカ',
        '小':'コ','林':'バヤシ','森':'モリ','原':'ハラ','野':'ノ','藤':'トウ',
        '木':'キ','村':'ムラ','本':'モト','井':'イ','石':'イシ','島':'シマ',
        '谷':'タニ','岡':'オカ','坂':'サカ','松':'マツ','竹':'タケ','梅':'ウメ',
        '福':'フク','金':'カネ','吉':'ヨシ','大':'オオ','佐':'サ','加':'カ',
        '安':'アン','渡':'ワタ','辺':'ナベ','部':'ベ','高':'タカ','橋':'ハシ',
        '鈴':'スズ','斉':'サイ','斎':'サイ','近':'コン','遠':'エン','後':'ゴ',
        '前':'マエ','内':'ウチ','宮':'ミヤ','岩':'イワ','柴':'シバ','酒':'サカ'
    };

    function convertToKatakana(text) {
        if (!text) return '';
        let result = '';
        for (let char of text) {
            result += kanjiMap[char] ? kanjiMap[char] : char;
        }
        return result.replace(/[\u3041-\u3096]/g, function(match) {
            return String.fromCharCode(match.charCodeAt(0) + 0x60);
        });
    }

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {}
    }

    function startBluetoothKeepAlive() {
        setInterval(() => {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {}
        }, 600000);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = false;
        recognition.continuous = false;

        recognition.onstart = () => {
            isListening = true;
            document.getElementById('micBtn').classList.add('listening');
            document.getElementById('micBtn').innerHTML = '<span style="font-size:32px;">👂</span><span>認識中...</span>';
            document.getElementById('statusBadge').innerText = 'お名前をお話しください';
            document.getElementById('statusBadge').style.color = '#00ffcc';
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript.trim();
            const clean = transcript.replace(/(さん|様|さま|君|くん)$/, '');
            currentKana = convertToKatakana(clean);

            document.getElementById('kanaDisplay').innerText = currentKana + ' さん';
            document.getElementById('statusBadge').innerText = '確認して [呼出] をタップ';
            document.getElementById('statusBadge').style.color = '#ffc107';
            document.getElementById('callBtn').disabled = false;
        };

        recognition.onerror = (event) => {
            if (event.error === 'not-allowed') alert('マイクが許可されていません。');
            resetMicBtn();
        };

        recognition.onend = () => {
            resetMicBtn();
        };
    }

    function resetMicBtn() {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
        document.getElementById('micBtn').innerHTML = '<span style="font-size:32px;">🎤</span><span>音声入力</span>';
    }

    function unlockAudioEngine() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            requestWakeLock();
            startBluetoothKeepAlive();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if ('speechSynthesis' in window) window.speechSynthesis.resume();
    }

    window.addEventListener('load', () => {
        if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
    });

    function startVoiceInput() {
        unlockAudioEngine();
        if (recognition && !isListening) {
            try { recognition.start(); } catch (e) {}
        }
    }

    function setManualName() {
        unlockAudioEngine();
        const input = document.getElementById('manualInput');
        const val = input.value.trim().replace(/(さん|様|さま|君|くん)$/, '');
        if (!val) return;

        currentKana = convertToKatakana(val);
        document.getElementById('kanaDisplay').innerText = currentKana + ' さん';
        document.getElementById('statusBadge').innerText = '確認して [呼出] をタップ';
        document.getElementById('statusBadge').style.color = '#ffc107';
        document.getElementById('callBtn').disabled = false;
        input.value = '';
        input.blur();
    }

    function handleManualKey(event) {
        if (event.key === 'Enter') setManualName();
    }

    function executeCall(forcedKana) {
        unlockAudioEngine();
        const kanaToCall = forcedKana || currentKana;
        if (!kanaToCall) return;

        if (resetTimer) clearTimeout(resetTimer);

        document.getElementById('kanaDisplay').innerText = kanaToCall + ' さん';
        document.getElementById('statusBadge').innerText = '呼び出し中';
        document.getElementById('statusBadge').style.color = '#28a745';
        document.getElementById('callBtn').disabled = true;

        playChimeAndSpeakDirect(kanaToCall);

        if (!forcedKana) {
            addHistory(kanaToCall);
            currentKana = "";
        }

        resetTimer = setTimeout(() => {
            resetToStandby();
        }, 60000);
    }

    function resetToStandby() {
        document.getElementById('kanaDisplay').innerText = '案内表示';
        document.getElementById('statusBadge').innerText = '待機中';
        document.getElementById('statusBadge').style.color = '#888';
        document.getElementById('callBtn').disabled = true;
    }

    function addHistory(kana) {
        const list = document.getElementById('historyList');
        const item = document.createElement('div');
        item.className = 'history-item';

        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

        item.innerHTML = `
            <div class="history-name-wrap">
                <span class="history-time">${timeStr}</span>
                <span class="history-kana">${kana}</span>
            </div>
            <button class="re-call-btn" onclick="executeCall('${kana}')">呼出</button>
        `;
        list.insertBefore(item, list.firstChild);
    }

    // チャイムをよりゆっくり再生し、1秒以上の間を置いてから名前を呼ぶ
    function playChimeAndSpeakDirect(nameKana) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const t = audioCtx.currentTime;
        
        // 1回目のチャイム（ゆっくり鳴らし、余韻を0.7秒持たせる）
        playTone(784, 1046, t);
        
        // 2回目のチャイム（1回目から0.9秒あけて再生）
        playTone(784, 1046, t + 0.9);

        // 2回目チャイム終了（t + 1.6秒）からさらに1秒強の間隔を空けて発声開始
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            window.speechSynthesis.resume();

            // 句読点によるポーズ制御でチャイム完了後＋約1秒の静寂を作ってからアナウンス
            const text = `、、、、、、、、、、、、${nameKana}さん、一番の診察室へお入りください`;
            globalUtterance = new SpeechSynthesisUtterance(text);
            globalUtterance.lang = 'ja-JP';
            globalUtterance.rate = 0.92; // 落ち着いた自然な速度
            globalUtterance.pitch = 1.0;

            const voices = window.speechSynthesis.getVoices();
            const jaVoice = voices.find(v => v.lang.includes('ja') || v.lang.includes('JP'));
            if (jaVoice) {
                globalUtterance.voice = jaVoice;
            }

            window.speechSynthesis.speak(globalUtterance);
        }
    }

    // 1音1音の余韻を長く、より落ち着いたトーンにする
    function playTone(f1, f2, startTime) {
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            
            // ピーン（0.3秒）➔ ポーン（0.4秒余韻）
            osc.frequency.setValueAtTime(f1, startTime);
            osc.frequency.setValueAtTime(f2, startTime + 0.3);
            
            gain.gain.setValueAtTime(0.25, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.7);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(startTime);
            osc.stop(startTime + 0.7);
        } catch (e) {}
    }
</script>
</body>
</html>
