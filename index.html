<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スマホ音声呼び出し</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            margin: 0; 
            background: #121212; 
            color: #fff; 
            min-height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            padding: 10px; 
            padding-bottom: 130px; 
            user-select: none;
        }

        /* 1. 履歴エリア */
        .history-section {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            flex: 1;
        }
        .history-title {
            font-size: 13px;
            color: #888;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 110px;
            overflow-y: auto;
        }
        .history-item {
            background: #1e1e1e;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2a2a2a;
        }
        .history-name-wrap {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .history-main-text {
            font-size: 16px;
            font-weight: bold;
            color: #00ffcc;
        }
        .history-time {
            font-size: 11px;
            color: #666;
            margin-right: 6px;
        }
        .re-call-btn {
            background: #333;
            color: #00ffcc;
            border: 1px solid #444;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        /* 2. メイン表示エリア */
        .display-area {
            width: 100%;
            max-width: 500px;
            margin: 10px auto;
            text-align: center;
            background: #1e1e1e;
            padding: 18px 15px; 
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .status-badge {
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
            padding: 3px 10px;
            background: #2a2a2a;
            border-radius: 15px;
            display: inline-block;
        }
        .display-main-box {
            font-size: 32px; 
            font-weight: bold;
            color: #00ffcc;
            min-height: 48px;
            word-break: break-all;
            line-height: 1.2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3. 手動入力エリア */
        .manual-input-area {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 10px auto;
            display: flex;
            gap: 8px;
        }
        .manual-input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #222;
            color: #fff;
            outline: none;
        }
        .manual-input:focus { border-color: #007bff; }
        .btn-set {
            background: #444;
            color: #fff;
            border: 1px solid #555;
            padding: 0 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        /* 4. 下部大型固定ボタン */
        .fixed-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #181818;
            padding: 10px;
            display: flex;
            justify-content: center;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.7);
            z-index: 100;
        }
        .btn-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            gap: 12px;
        }
        .action-btn {
            flex: 1;
            height: 100px; 
            border-radius: 12px;
            border: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
        }
        .action-btn:active { transform: scale(0.97); }

        .btn-mic {
            background: #007bff;
            color: white;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.4);
        }
        .btn-mic.listening {
            background: #dc3545;
            box-shadow: 0 0 20px rgba(220, 53, 69, 0.9);
            animation: pulse 1.2s infinite;
        }

        .btn-call {
            background: #28a745;
            color: white;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
        }
        .btn-call:disabled {
            background: #333;
            color: #666;
            box-shadow: none;
            cursor: not-allowed;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 1. 履歴エリア -->
    <div class="history-section">
        <div class="history-title">
            <span>呼び出し履歴</span>
            <span style="font-size: 11px;">※タップで再呼出</span>
        </div>
        <div id="historyList" class="history-list"></div>
    </div>

    <!-- 2. メイン表示エリア -->
    <div class="display-area">
        <div id="statusBadge" class="status-badge">準備完了</div>
        <div id="displayMainBox" class="display-main-box">案内表示</div>
    </div>

    <!-- 3. 手動入力エリア -->
    <div class="manual-input-area">
        <input type="text" id="manualInput" class="manual-input" placeholder="直接入力（漢字・かなOK）..." onkeypress="handleManualKey(event)">
        <button class="btn-set" onclick="setManualName()">手動入力</button>
    </div>

    <!-- 4. 固定操作ボタン -->
    <div class="fixed-footer">
        <div class="btn-container">
            <button id="micBtn" class="action-btn btn-mic" onclick="startVoiceInput()">
                <span style="font-size: 32px;">🎤</span>
                <span>音声入力</span>
            </button>
            <button id="callBtn" class="action-btn btn-call" onclick="executeCall()" disabled>
                <span style="font-size: 32px;">📢</span>
                <span>呼出</span>
            </button>
        </div>
    </div>

<script>
    let audioCtx = null;
    let wakeLock = null;
    let resetTimer = null;
    let recognition = null;
    let isListening = false;
    let currentRaw = "";
    let currentKana = "";
    let globalUtterance = null; 

    // フル名字辞書（促音・濁音などの特殊読みを網羅）
    const fullSurnameMap = {
        '新田':'ニッタ','新井':'アライ','新谷':'シンタニ','新居':'ニイ','新名':'シンミョウ',
        '中西':'ナカニシ','大西':'オオニシ','西村':'ニシムラ','西田':'ニシダ','西川':'ニシカワ','西山':'ニシヤマ',
        '佐藤':'サトウ','鈴木':'スズキ','高橋':'タカハシ','田中':'タナカ','渡辺':'ワタナベ','渡邊':'ワタナベ','渡邉':'ワタナベ',
        '伊藤':'イトウ','山本':'ヤマモト','中村':'ナカムラ','小林':'コバヤシ','加藤':'カトウ','吉田':'ヨシダ','山田':'ヤマダ',
        '佐々木':'ササキ','山口':'ヤマグチ','松本':'マツモト','井上':'イノウエ','木村':'キムラ','林':'ハヤシ','斎藤':'サイトウ',
        '斉藤':'サイトウ','齊藤':'サイトウ','清水':'シミズ','山崎':'ヤマザキ','森':'モリ','池田':'イケダ','橋本':'ハシモト',
        '阿部':'アベ','石川':'イシカワ','山下':'ヤマシタ','中島':'ナカジマ','石井':'イシイ','小川':'オガワ','前田':'マエダ',
        '岡田':'オカダ','長谷川':'ハセガワ','藤田':'フジタ','近藤':'コンドウ','後藤':'ゴトウ','遠藤':'エンドウ','村上':'ムラカミ',
        '村田':'ムラタ','太田':'オオタ','金子':'カネコ','藤井':'フジイ','福田':'フクダ','三浦':'ミウラ','竹内':'タケウチ',
        '中川':'ナカガワ','松田':'マツダ','原田':'ハラダ','中野':'ナカノ','小野':'オノ','田村':'タムラ','竹田':'タケダ',
        '藤原':'フジワラ','石田':'イシダ','上田':'ウエダ','森田':'モリタ','原':'ハラ','柴田':'シバタ','酒井':'サカイ',
        '工藤':'クドウ','横山':'ヨコヤマ','宮崎':'ミヤザキ','宮本':'ミヤモト','内田':'ウチダ','高木':'タカギ','安田':'ヤスダ',
        '島田':'シマダ','谷口':'タニグチ','大野':'オオノ','高田':'タカダ','丸山':'マルヤマ','杉山':'スギヤマ','今井':'イマイ',
        '河野':'コウノ','上野':'ウエノ','武田':'タケダ','野村':'ノムラ','菅原':'スガワラ','千葉':'チバ','岩崎':'イワサキ',
        '木下':'キノシタ','久保':'クボ','佐野':'サノ','野口':'ノグチ','松井':'マツイ','市川':'イチカワ','菊地':'キクチ',
        '菊池':'キクチ','水野':'ミズノ','服部':'ハットリ','古川':'フルカワ','藤本':'フジモト','大島':'オオシマ','内藤':'ナイトウ',
        '杉本':'スギモト','矢野':'ヤノ','小池':'コイケ','安藤':'アンドウ','池水':'イケミズ','東':'ヒガシ','南':'ミナミ','北':'キタ'
    };

    // 漢字1文字ずつの音訓変換マップ（名字パーツ網羅）
    const kanjiCharMap = {
        '新':'シン','田':'タ','中':'ナカ','西':'ニシ','東':'ヒガシ','南':'ミナミ','北':'キタ','上':'ウエ','下':'シタ','前':'マエ','後':'ゴ',
        '左':'ヒダリ','右':'ミギ','内':'ウチ','外':'ソト','山':'ヤマ','川':'カワ','村':'ムラ','町':'マチ','市':'イチ','谷':'タニ',
        '岡':'オカ','坂':'サカ','崎':'サキ','沢':'サワ','澤':'サワ','原':'ハラ','野':'ノ','塚':'ツカ','沼':'ヌマ','浜':'ハマ',
        '濱':'ハマ','浦':'ウラ','瀬':'セ','滝':'タキ','泉':'イズミ','池':'イケ','湖':'ミズウミ','海':'ウミ','江':'エ','津':'ツ',
        '渡':'ワタ','辺':'ナベ','邊':'ナベ','邉':'ナベ','部':'ベ','木':'キ','林':'バヤシ','森':'モリ','本':'モト','枝':'エダ',
        '根':'ネ','杉':'スギ','松':'マツ','竹':'タケ','梅':'ウメ','桜':'サクラ','櫻':'サクラ','柳':'ヤナギ','栗':'クリ','柿':'カキ',
        '楠':'クス','椿':'ツバキ','桐':'キリ','萩':'ハギ','菊':'キク','藤':'フジ','葛':'クズ','芦':'アシ','荻':'オギ','菅':'スガ',
        '芝':'シバ','牧':'マキ','畑':'ハタ','畠':'ハタケ','石':'イシ','岩':'イワ','砂':'スナ','堀':'ホリ','井':'イ','戸':'ト',
        '門':'モン','倉':'クラ','蔵':'クラ','屋':'ヤ','室':'ムロ','堂':'ドウ','寺':'テラ','宮':'ミヤ','神':'カミ','島':'シマ',
        '嶋':'シマ','金':'カネ','銀':'ギン','銅':'ドウ','鉄':'テツ','鈴':'スズ','鏡':'カガミ','鍋':'ナベ','釜':'カマ','矢':'ヤ',
        '弓':'ユミ','吉':'ヨシ','福':'フク','幸':'サチ','徳':'トク','富':'トミ','宝':'タカラ','寿':'コトブキ','喜':'ヨシ','祝':'イワイ',
        '栄':'サカエ','豊':'トヨ','盛':'モリ','益':'マス','高':'タカ','安':'アン','長':'ナガ','大':'オオ','小':'コ','広':'ヒロ',
        '廣':'ヒロ','太':'タ','細':'ホソ','重':'シゲ','清':'キヨ','白':'シロ','黒':'クロ','赤':'アカ','青':'アオ','黄':'キ',
        '緑':'ミドリ','春':'ハル','夏':'ナツ','秋':'アキ','冬':'フユ','朝':'アサ','昼':'ヒル','夕':'ユウ','夜':'ヨル','日':'ヒ',
        '月':'ツキ','星':'ホシ','光':'ヒカリ','風':'カゼ','雨':'アメ','雪':'ユキ','雲':'クモ','佐':'サ','加':'カ','伊':'イ',
        '阿':'ア','宇':'ウ','尾':'オ','保':'ホ','多':'タ','奈':'ナ','仁':'ジン','義':'ヨシ','智':'トモ','信':'シン','忠':'タダ',
        '孝':'タカ','勇':'イサミ','武':'タケ','文':'フミ','正':'タダ','直':'ナオ','真':'マ','誠':'マコト','水':'ミズ','久':'ク',
        '生':'イケ','平':'タイラ','永':'ナガ','立':'タテ','橋':'ハシ'
    };

    // 漢字から確実にカタカナ音を生成する関数
    function convertToPronounceKana(text) {
        if (!text) return '';
        if (fullSurnameMap[text]) return fullSurnameMap[text];
        
        let res = '';
        for (let char of text) {
            res += kanjiCharMap[char] ? kanjiCharMap[char] : char;
        }
        return res.replace(/[\u3041-\u3096]/g, function(match) {
            return String.fromCharCode(match.charCodeAt(0) + 0x60);
        });
    }

    // 漢字（発音予定のカタカナ）という形式に整形
    function formatDisplayName(raw, kana) {
        if (!raw) return '';
        if (raw === kana) return `${raw} さん`;
        return `${raw} (${kana}) さん`;
    }

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {}
    }

    function startBluetoothKeepAlive() {
        setInterval(() => {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {}
        }, 600000);
    }

    // 音声認識
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = false;
        recognition.continuous = false;

        recognition.onstart = () => {
            isListening = true;
            document.getElementById('micBtn').classList.add('listening');
            document.getElementById('micBtn').innerHTML = '<span style="font-size:32px;">👂</span><span>認識中...</span>';
            document.getElementById('statusBadge').innerText = 'お名前をお話しください';
            document.getElementById('statusBadge').style.color = '#00ffcc';
        };

        recognition.onresult = (event) => {
            let rawText = event.results[0][0].transcript.trim();
            let clean = rawText.replace(/(さん|様|さま|君|くん)$/, '');
            
            currentRaw = clean;
            currentKana = convertToPronounceKana(clean);

            // 画面に「新田 (ニッタ) さん」のように表示
            document.getElementById('displayMainBox').innerText = formatDisplayName(currentRaw, currentKana);
            document.getElementById('statusBadge').innerText = '確認して [呼出] をタップ';
            document.getElementById('statusBadge').style.color = '#ffc107';
            document.getElementById('callBtn').disabled = false;
        };

        recognition.onerror = (event) => {
            if (event.error === 'not-allowed') alert('マイクが許可されていません。');
            resetMicBtn();
        };

        recognition.onend = () => {
            resetMicBtn();
        };
    }

    function resetMicBtn() {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
        document.getElementById('micBtn').innerHTML = '<span style="font-size:32px;">🎤</span><span>音声入力</span>';
    }

    function unlockAudioEngine() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            requestWakeLock();
            startBluetoothKeepAlive();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if ('speechSynthesis' in window) window.speechSynthesis.resume();
    }

    window.addEventListener('load', () => {
        if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
    });

    function startVoiceInput() {
        unlockAudioEngine();
        if (recognition && !isListening) {
            try { recognition.start(); } catch (e) {}
        }
    }

    function setManualName() {
        unlockAudioEngine();
        const input = document.getElementById('manualInput');
        const val = input.value.trim().replace(/(さん|様|さま|君|くん)$/, '');
        if (!val) return;

        currentRaw = val;
        currentKana = convertToPronounceKana(val);

        document.getElementById('displayMainBox').innerText = formatDisplayName(currentRaw, currentKana);
        document.getElementById('statusBadge').innerText = '確認して [呼出] をタップ';
        document.getElementById('statusBadge').style.color = '#ffc107';
        document.getElementById('callBtn').disabled = false;
        input.value = '';
        input.blur();
    }

    function handleManualKey(event) {
        if (event.key === 'Enter') setManualName();
    }

    function executeCall(forcedRaw, forcedKana) {
        unlockAudioEngine();
        const rawToCall = forcedRaw || currentRaw;
        const kanaToCall = forcedKana || currentKana || convertToPronounceKana(rawToCall);
        if (!rawToCall) return;

        if (resetTimer) clearTimeout(resetTimer);

        document.getElementById('displayMainBox').innerText = formatDisplayName(rawToCall, kanaToCall);
        document.getElementById('statusBadge').innerText = '呼び出し中';
        document.getElementById('statusBadge').style.color = '#28a745';
        document.getElementById('callBtn').disabled = true;

        // 音声発声には【カタカナ音】だけを渡して正確に発音
        playChimeAndSpeakDirect(kanaToCall);

        if (!forcedRaw) {
            addHistory(rawToCall, kanaToCall);
            currentRaw = "";
            currentKana = "";
        }

        resetTimer = setTimeout(() => {
            resetToStandby();
        }, 60000);
    }

    function resetToStandby() {
        document.getElementById('displayMainBox').innerText = '案内表示';
        document.getElementById('statusBadge').innerText = '待機中';
        document.getElementById('statusBadge').style.color = '#888';
        document.getElementById('callBtn').disabled = true;
    }

    function addHistory(raw, kana) {
        const list = document.getElementById('historyList');
        const item = document.createElement('div');
        item.className = 'history-item';

        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        const displayText = formatDisplayName(raw, kana);

        item.innerHTML = `
            <div class="history-name-wrap">
                <span class="history-time">${timeStr}</span>
                <span class="history-main-text">${displayText}</span>
            </div>
            <button class="re-call-btn" onclick="executeCall('${raw}', '${kana}')">呼出</button>
        `;
        list.insertBefore(item, list.firstChild);
    }

    // チャイム再生 ➔ 2秒後にカタカナ発声
    function playChimeAndSpeakDirect(kanaToSpeak) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const t = audioCtx.currentTime;
        
        playStandardTone(784, 1046, t);
        playStandardTone(784, 1046, t + 0.35);

        setTimeout(() => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                window.speechSynthesis.resume();

                const text = `${kanaToSpeak}さん、一番の診察室へお入りください`;
                globalUtterance = new SpeechSynthesisUtterance(text);
                globalUtterance.lang = 'ja-JP';
                globalUtterance.rate = 0.95;
                globalUtterance.pitch = 1.0;

                const voices = window.speechSynthesis.getVoices();
                const jaVoice = voices.find(v => v.lang.includes('ja') || v.lang.includes('JP'));
                if (jaVoice) {
                    globalUtterance.voice = jaVoice;
                }

                window.speechSynthesis.speak(globalUtterance);
            }
        }, 2000);
    }

    function playStandardTone(f1, f2, startTime) {
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f1, startTime);
            osc.frequency.setValueAtTime(f2, startTime + 0.15);
            gain.gain.setValueAtTime(0.25, startTime);
            gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.6);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.6);
        } catch (e) {}
    }
</script>
</body>
</html>
